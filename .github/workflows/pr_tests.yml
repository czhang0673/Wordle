name: Python PR Checks

#run the script every time pull request is opened or updated
on:
  pull_request:
    branches: ["main", "master"]

#investigate these later
jobs:
  build-and-test:
    # This creates a fresh Ubuntu Linux server for your code
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your code from the repository onto the server
    - name: Check out repository code
      uses: actions/checkout@v4

    # Step 2: Install Python and set up caching to make future runs faster
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11" # You can change this to match your local version
        cache: 'pip'

    # Step 3: Install all required libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run the linter to check for syntax and style errors
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all other PEP 8 styling warnings as just warnings, not failures
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Step 5: Run your test suite with a coverage report
    - name: Test with pytest
      run: |
        # This runs your tests and checks how much of wordle_game.py is covered
        pytest --cov=wordle_game test_wordle_game.py